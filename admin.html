<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin | Andalucia Joyeria</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <section class="login-card" id="loginView">
        <p class="text-uppercase small text-muted mb-2">Andalucia Joyeria</p>
        <h1 class="h3 mb-4">Panel admin</h1>
        <form id="loginForm" class="vstack gap-3">
          <div>
            <label class="form-label" for="loginEmail">Email</label>
            <input class="form-control" id="loginEmail" type="email" required />
          </div>
          <div>
            <label class="form-label" for="loginPassword">Password</label>
            <input class="form-control" id="loginPassword" type="password" required />
          </div>
          <button class="btn btn-dark w-100" type="submit">Ingresar</button>
          <p class="alert alert-danger d-none mb-0" id="loginError"></p>
        </form>
      </section>

      <section class="dashboard d-none" id="dashboardView">
        <header class="dashboard-header">
          <div>
            <p class="text-uppercase small text-muted mb-1">Administracion</p>
            <h1 class="h2 mb-0">Catalogo Andalucia</h1>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-secondary" href="/" target="_blank">Ver sitio</a>
            <button class="btn btn-dark" id="logoutButton" type="button">Salir</button>
          </div>
        </header>

        <div class="alert d-none" id="adminMessage"></div>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="panel-card">
              <h2 class="h5 mb-3" id="productFormTitle">Nuevo producto</h2>
              <form id="productForm" class="vstack gap-3">
                <input id="productId" type="hidden" />
                <div>
                  <label class="form-label" for="productName">Nombre</label>
                  <input class="form-control" id="productName" required />
                </div>
                <div>
                  <label class="form-label" for="productDescription">Descripcion</label>
                  <textarea class="form-control" id="productDescription" rows="3" required></textarea>
                </div>
                <div class="row g-2">
                  <div class="col-6">
                    <label class="form-label" for="productPrice">Precio</label>
                    <input class="form-control" id="productPrice" type="number" min="0" step="1" required />
                  </div>
                  <div class="col-6">
                    <label class="form-label" for="productStock">Stock</label>
                    <input class="form-control" id="productStock" type="number" min="0" step="1" value="1" />
                  </div>
                </div>
                <div>
                  <label class="form-label" for="productMaterial">Material</label>
                  <input class="form-control" id="productMaterial" placeholder="Plata, acero, dorado..." />
                </div>
                <div>
                  <label class="form-label" for="productCategory">Categoria</label>
                  <select class="form-select" id="productCategory" required></select>
                </div>
                <div>
                  <label class="form-label" for="productImage">Imagen</label>
                  <div class="d-flex gap-3 align-items-start">
                    <input class="form-control flex-grow-1" id="productImage" type="file" accept="image/*" />
                    <img id="imagePreview" class="product-thumb d-none" alt="Vista previa" />
                  </div>
                  <div class="form-text">Una sola imagen por producto. Si subis otra, reemplaza la anterior.</div>
                </div>
                <div>
                  <label class="form-label" for="productImageAlt">Texto alternativo</label>
                  <input class="form-control" id="productImageAlt" />
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" id="productFeatured" type="checkbox" />
                  <label class="form-check-label" for="productFeatured">Destacado</label>
                </div>
                <div class="form-check form-switch">
                  <input class="form-check-input" id="productActive" type="checkbox" checked />
                  <label class="form-check-label" for="productActive">Activo</label>
                </div>
                <div class="d-flex gap-2">
                  <button class="btn btn-dark flex-grow-1" type="submit">Guardar</button>
                  <button class="btn btn-outline-secondary" id="cancelEditButton" type="button">Limpiar</button>
                </div>
              </form>
            </div>

            <div class="panel-card mt-4">
              <h2 class="h5 mb-3">Categorias</h2>
              <form id="categoryForm" class="input-group mb-3">
                <input class="form-control" id="categoryName" placeholder="Nueva categoria" required />
                <button class="btn btn-dark" type="submit">Crear</button>
              </form>
              <div class="list-group" id="categoryList"></div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="panel-card">
              <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
                <h2 class="h5 mb-0">Productos</h2>
                <button class="btn btn-outline-dark btn-sm" id="refreshButton" type="button">Actualizar</button>
              </div>
              <div class="table-responsive">
                <table class="table align-middle">
                  <thead>
                    <tr>
                      <th>Imagen</th>
                      <th>Producto</th>
                      <th>Precio</th>
                      <th>Estado</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="productTable"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/admin.js"></script>
  </body>
</html>
